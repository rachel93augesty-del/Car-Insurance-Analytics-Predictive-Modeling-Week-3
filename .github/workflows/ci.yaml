name: Python CI

on:
  push:
task-2
    # Trigger on all branches including task-2
    branches: [ main, task-1, task-2 ]

    branches: [ main, task-1 ]
 main
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
 task-2

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python

    steps:
      - uses: actions/checkout@v3
 main
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
 task-2

      # Step 3: Cache pip dependencies
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install dependencies and flake8
      - name: Install dependencies and flake8
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      # Step 5: Lint code with flake8
      - name: Lint code
        run: flake8 .

      # Step 6: Optional - run tests if you have any
      # - name: Run tests
