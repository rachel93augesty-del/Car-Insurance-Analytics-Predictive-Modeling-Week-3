name: CI

on:
  push:
    branches: [ main, task-3, task-4 ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn matplotlib seaborn flake8 xgboost shap

      # 4. Lint Python scripts only
      - name: Lint Python scripts
        run: |
          flake8 scripts/ --max-line-length=120

      # 5. Optional: Add more checks here if needed
      # - name: Run model tests
      #   run: python tests/test_model.py
