name: CI

on:
  push:
    branches: [ main, task-3, task-4 ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn matplotlib seaborn jupyter flake8 xgboost shap

      # 4. Run Python linting
      - name: Lint Python code
        run: |
          flake8 notebooks/ scripts/ --max-line-length=120

      # 5. Optional: Run notebooks (basic execution check)
      - name: Execute Notebooks
        run: |
          pip install nbconvert
          jupyter nbconvert --to notebook --execute notebooks/03_Hypothesis_Testing.ipynb --output /dev/null
          jupyter nbconvert --to notebook --execute notebooks/visualise.ipynb --output /dev/null

      # 6. Optional: Add more model checks here
      # - name: Run model tests
      #   run: |
      #     python tests/test_model.py
