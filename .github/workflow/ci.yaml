name: Python CI

on:
  push:
    branches:
      - main
      - task-1
      - task-2
      - task-3   # <-- add this
  pull_request:
    branches:
      - main
      - task-3   # optional, if you want PR to trigger workflow
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 .
